default:
  tags:
    - go
  before_script:
    - export PATH="$GOPATH/bin:$PATH"
  after_script:
    - chmod -R u+w "$GOMODCACHE" || true

variables:
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go/pkg/mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go/build"
  GOFLAGS: "-mod=readonly"
  # Pinned instead of "local": a runner image update must not silently change
  # the toolchain underneath the linters. The toolchain is fetched through the
  # module proxy and cached with the module cache.
  GOTOOLCHAIN: "go1.27.1"
  GOLANGCI_LINT_VERSION: "v2.14.0"
  GOSEC_VERSION: "v2.29.0"
  STATICCHECK_VERSION: "v0.8.1"
  SONARQUBE: "$CI_PROJECT_DIR/sonarqube"
  MAJOR: "1"
  GITHUB_REPO: "RomanSpies/Bencher2Gitlab"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - build
  - test
  - sast
  - deps
  - sonar
  - release

.go-cache: &go-cache
  cache:
    key:
      files:
        - go.mod
    paths:
      - .cache/go/pkg/mod
      - .cache/go/build

build:
  stage: build
  <<: *go-cache
  script:
    # Computed once here and handed to release via dotenv, so the binary and
    # the release tag always agree even if the pipeline crosses midnight.
    - VERSION="${MAJOR}.$(date +%-y).$(date +%-V).${CI_PIPELINE_IID}"
    - echo "VERSION=${VERSION}" > build.env
    - go build ./...
    - CGO_ENABLED=0 go build -ldflags "-X main.version=${VERSION}" -o bencher2gitlab .
    - ./bencher2gitlab --version
    - zip bencher2gitlab.zip bencher2gitlab
  artifacts:
    paths:
      - bencher2gitlab.zip
    reports:
      dotenv: build.env
    expire_in: 2 weeks

unit-tests:
  stage: test
  <<: *go-cache
  needs: [build]
  script:
    - mkdir -p "$SONARQUBE"
    - which gotestsum || go install gotest.tools/gotestsum@latest
    - gotestsum --format standard-verbose --jsonfile "$SONARQUBE/test-report.json" --junitfile "$SONARQUBE/junit-report.xml" -- -count=1 -race -coverprofile=coverage.out -covermode=atomic ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: sonarqube/junit-report.xml
    paths:
      - coverage.out
      - sonarqube/test-report.json
      - sonarqube/junit-report.xml
    expire_in: 7 days

coverage-xml:
  stage: test
  <<: *go-cache
  needs: [unit-tests]
  script:
    - which gocover-cobertura || go install github.com/boumenot/gocover-cobertura@latest
    - gocover-cobertura < coverage.out > coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 7 days

go-vet:
  stage: sast
  <<: *go-cache
  needs: [build]
  script:
    - go vet ./...

# The SAST jobs distinguish findings from the tool itself breaking. Findings
# stay non-blocking (they reach Sonar or show as a warning); a linter that
# cannot load the packages fails the job, because it would otherwise report
# nothing and look green.

staticcheck:
  stage: sast
  <<: *go-cache
  needs: [build]
  # 42 = findings only, shown as a warning. Every other failure is real.
  allow_failure:
    exit_codes: 42
  script:
    - go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
    - status=0; staticcheck ./... > staticcheck.txt || status=$?
    - cat staticcheck.txt
    - |
      if [ "$status" -gt 1 ] || grep -q '(compile)$' staticcheck.txt; then
        echo "staticcheck failed or could not load the packages"
        exit 1
      fi
    - if [ "$status" -eq 1 ]; then exit 42; fi

gosec:
  stage: sast
  <<: *go-cache
  needs: [build]
  script:
    - mkdir -p "$SONARQUBE"
    - go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
    # The SARIF report drops package loading errors entirely, so the JSON
    # report goes to stdout alongside it to check the "Golang errors" section.
    - gosec -no-fail -exclude-dir .cache -severity medium
        -fmt sarif -out "$SONARQUBE/gosec.sarif"
        -stdout -verbose json ./... > gosec.json
    - |
      if ! grep -Eq '"Golang errors": *(\{ *\}|null)' gosec.json; then
        echo "gosec could not load the packages; its SARIF report would be silently empty:"
        cat gosec.json
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - sonarqube/gosec.sarif
      - gosec.json
    expire_in: 7 days

golangci-lint:
  stage: sast
  <<: *go-cache
  needs: [build]
  script:
    - mkdir -p "$SONARQUBE"
    - go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
    - golangci-lint run --issues-exit-code=0
        --output.text.path=stdout
        --output.checkstyle.path="$SONARQUBE/golangci-checkstyle.xml" ./...
    # A typecheck entry means the packages never loaded and no linter ran;
    # Sonar would only show it as one odd finding on an untouched line.
    - |
      if grep -q 'source="typecheck"' "$SONARQUBE/golangci-checkstyle.xml"; then
        echo "golangci-lint could not type-check the packages (linter/toolchain mismatch?)"
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - sonarqube/golangci-checkstyle.xml
    expire_in: 7 days

dependency-scan:
  stage: deps
  needs: [build]
  allow_failure: true
  script:
    - mkdir -p "$SONARQUBE"
    - trivy fs --scanners vuln --format template
        --template "@/usr/local/share/trivy/templates/gitlab.tpl"
        -o gl-dependency-scanning-report.json .
    - trivy fs --scanners vuln --format sarif
        --severity MEDIUM,HIGH,CRITICAL
        -o "$SONARQUBE/trivy.sarif" .
  artifacts:
    when: always
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
    paths:
      - sonarqube/trivy.sarif
    expire_in: 7 days

sonar-job:
  stage: sonar
  needs:
    - unit-tests
    - coverage-xml
    - golangci-lint
    - gosec
    - dependency-scan
  allow_failure: false
  script:
    - sonar-scanner
        -Dsonar.token=$SONAR_TOKEN
        -Dsonar.projectKey=$SONAR_PROJECT_KEY
        -Dsonar.sources=.
        -Dsonar.exclusions=**/*_test.go,**/.cache/**
        -Dsonar.tests=.
        -Dsonar.test.inclusions=**/*_test.go
        -Dsonar.coverage.exclusions=main.go,internal/gitlab/gitlabtest/**
        -Dsonar.go.coverage.reportPaths=coverage.out
        -Dsonar.go.tests.reportPaths=$SONARQUBE/test-report.json
        -Dsonar.go.golangci-lint.reportPaths=$SONARQUBE/golangci-checkstyle.xml
        -Dsonar.sarifReportPaths=$SONARQUBE/gosec.sarif,$SONARQUBE/trivy.sarif
        -Dsonar.qualitygate.wait=true

release:
  stage: release
  needs: [build, unit-tests]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - echo "Releasing version ${VERSION}"
    - unzip -o bencher2gitlab.zip
    - gh release create "$VERSION" bencher2gitlab
        --repo "$GITHUB_REPO"
        --title "$VERSION"
        --notes "Automated release from GitLab pipeline ${CI_PIPELINE_IID} (${CI_COMMIT_SHORT_SHA})"
    - git tag "$VERSION" "$CI_COMMIT_SHA" 2>/dev/null || true
    - git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$VERSION" 2>/dev/null || true

gofmt:
  stage: sast
  needs: []
  script:
    - |
      unformatted=$(gofmt -l .)
      if [ -n "$unformatted" ]; then
        echo "The following files are not gofmt'd:"
        echo "$unformatted"
        exit 1
      fi
